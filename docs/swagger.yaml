  /auth/login:
    post:
      consumes:
      - application/json
      description: 'Deprecated: use LoginHash instead, which hashes the password on
        the client before sending it.'
      parameters:
      - description: username/password credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: {token, refresh_token, device_key}'
          schema:
            $ref: '#/definitions/common.Resp-gin_H'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "402":
          description: 'second factor required: data carries {need_second_factor,
            method_id, challenge_id} — complete it at POST /auth/login/2fa'
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: too many devices
          schema:
            $ref: '#/definitions/common.Resp-any'
        "429":
          description: too many failed attempts
          schema:
            $ref: '#/definitions/common.Resp-any'
      summary: Login (deprecated)
      tags:
      - auth
  /auth/login/2fa:
    post:
      consumes:
      - application/json
      description: Verifies a login step-up challenge's code (a current TOTP code
        or an unused recovery code) and, on success, issues a session token. Anonymous
        by necessity (no session exists yet) — the challenge id, minted only after
        a correct password, is the access control. Compatibility alias for POST /auth/method/builtin.totp/stepup/finish.
      parameters:
      - description: challenge id + code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.LoginTOTPStepUpReq'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: {token, refresh_token, device_key}'
          schema:
            $ref: '#/definitions/common.Resp-gin_H'
        "400":
          description: wrong/expired code or challenge
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: resolved user disabled since the challenge was minted
          schema:
            $ref: '#/definitions/common.Resp-any'
        "429":
          description: too many failed attempts
          schema:
            $ref: '#/definitions/common.Resp-any'
      summary: Complete a TOTP login step-up
      tags:
      - auth
  /auth/login/hash:
    post:
      consumes:
      - application/json
      description: Login using a password pre-hashed by the client with SHA256 (see
        model.StaticHash), avoiding sending the plaintext password over the wire.
      parameters:
      - description: username/hashed-password credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: {token, refresh_token, device_key}'
          schema:
            $ref: '#/definitions/common.Resp-gin_H'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "402":
          description: 'second factor required: data carries {need_second_factor,
            method_id, challenge_id} — complete it at POST /auth/login/2fa'
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: too many devices
          schema:
            $ref: '#/definitions/common.Resp-any'
        "429":
          description: too many failed attempts
          schema:
            $ref: '#/definitions/common.Resp-any'
