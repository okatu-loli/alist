      - ApiKeyAuth: []
      summary: Update an agent
      tags:
      - admin_agent
  /v4/admin/agents/{id}/confirm:
    post:
      description: Marks an agent's pairing as SAS-confirmed and enables it. Idempotent.
        Admin only.
      parameters:
      - description: agent id
        in: path
