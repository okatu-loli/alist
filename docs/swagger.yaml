      tags:
      - fs
  /v4/admin/index/build:
    post:
      description: Clears the current index, then walks every storage as admin feeding
        it into the active search backend. The heavy work runs detached, so the call
        returns immediately. Rejected while a build is already running.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: index is already running
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Build search index
      tags:
      - admin-search-index
  /v4/admin/index/clear:
    post:
      description: Drops the whole search index and resets the persisted progress
        snapshot. Rejected while a build is running.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: index is running
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Clear search index
      tags:
      - admin-search-index
  /v4/admin/index/progress:
    get:
      description: Returns the persisted index build progress snapshot for the caller
        to poll during a build.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-github_com_AlistGo_alist-ext_IndexProgress'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Get search index progress
      tags:
      - admin-search-index
  /v4/admin/index/stop:
    post:
      description: Asks an in-flight index build to abort. Rejected when nothing is
        running.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: index is not running
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Stop search index build
      tags:
      - admin-search-index
  /v4/admin/index/update:
    post:
      consumes:
      - application/json
      description: Incrementally re-indexes the given paths (defaults to the whole
        tree) against the active backend, dropping and re-walking each path's subtree.
        Runs detached; rejected while a build is running or when the backend does
        not support incremental update.
      parameters:
      - description: paths + max depth, both optional
        in: body
        name: body
        schema:
          $ref: '#/definitions/handles.UpdateIndexReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: index is running, or update not supported
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Update search index
      tags:
      - admin-search-index
  /v4/admin/labels:
    post:
      consumes:
      - application/json
      description: Adds a vocabulary entry (name/color) to the shared label set. Admin
        only.
