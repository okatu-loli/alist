    post:
      consumes:
      - application/json
      description: Registered for any HTTP method via gin Any(). The method/data fields
        are opaque and driver-defined; response shape varies by driver and method.
      parameters:
      - description: path/password/method/data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.FsOtherReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: password incorrect or no permission
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Driver-specific other operation
      tags:
      - fs
  /fs/put:
    put:
      consumes:
      - application/octet-stream
      description: Runs behind middlewares.FsUp and the upload rate limiter. The destination
        path is joined with the caller's base path. If As-Task is true, the upload
        is queued as a background task instead of completing synchronously.
      parameters:
      - description: URL-escaped destination path, joined with the caller's base path
        in: header
        name: File-Path
        required: true
        type: string
      - description: size in bytes of the uploaded content
        in: header
        name: Content-Length
        required: true
        type: integer
      - description: modification time in Unix milliseconds; defaults to now if absent/invalid
        in: header
        name: Last-Modified
        type: integer
      - description: if \
        in: header
        name: As-Task
        type: boolean
      - description: if \
        in: header
        name: Overwrite
        type: boolean
      - description: MIME type of the uploaded content; guessed from the file name
          if absent
        in: header
        name: Content-Type
        type: string
      - description: expected MD5 hash of the content
        in: header
        name: X-File-Md5
        type: string
      - description: expected SHA1 hash of the content
        in: header
        name: X-File-Sha1
        type: string
      - description: expected SHA256 hash of the content
        in: header
        name: X-File-Sha256
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'data: {} or {task: TaskInfo} when As-Task is true'
          schema:
            $ref: '#/definitions/common.Resp-gin_H'
        "400":
          description: bad File-Path or Content-Length
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: no permission or file exists
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Upload file (raw stream)
      tags:
      - fs
  /fs/recursive_move:
    post:
      consumes:
      - application/json
      description: Requires ActMove on src_dir and on each source file, plus ActWrite
        on dst_dir. conflict_policy controls name clashes in dst_dir (e.g. "overwrite",
        "skip", "cancel").
      parameters:
      - description: src_dir/dst_dir/conflict_policy
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.RecursiveMoveReq'
      produces:
      - application/json
      responses:
        "200":
          description: 'message: Successfully moved N file(s)'
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: permission denied or file exists (cancel policy)
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Recursively move files into a single destination
      tags:
      - fs
