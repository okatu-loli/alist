      - description: label name/color
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.LabelReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-model_Label'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Create label
      tags:
      - admin-labels
  /v4/admin/labels/{id}:
    delete:
      description: Removes a vocabulary entry and cascades the removal to every file
        binding it. Admin only.
      parameters:
      - description: label id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
