      - description: path
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.MkdirOrLinkReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-model_Link'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
