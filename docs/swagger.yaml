      tags:
      - admin_plugin
    post:
      consumes:
      - application/json
      description: "Imports a plugin source: a registry index URL plus the ed25519
        public key its packages are signed with. Packages signed by this key install
        as tier-verified (\U0001F7E1) with a source-attribution warning. The index
        is probed best-effort; an unreachable index yields a warning, not an error.
        Admin only."
      parameters:
      - description: source to import
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/extension.PluginSource'
