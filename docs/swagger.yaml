      tags:
      - extension
  /v4/extensions/{id}/ui/{filepath}:
    get:
      description: 'Serves a static file from the active version''s ui/ subdir, for
        the sandboxed iframe host (SDK §5). Path traversal is rejected. Responses
        carry Content-Security-Policy: sandbox and X-Content-Type-Options: nosniff
        so the bundle runs in an opaque origin.'
      parameters:
      - description: extension id
        in: path
        name: id
        required: true
        type: string
      - description: file path within ui/
        in: path
        name: filepath
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Serve extension UI bundle file
      tags:
      - extension
  /v4/extensions/{id}/wizard/{session}/next:
    post:
      consumes:
      - application/json
      description: Submits the current step's answers and returns the next step or
        a done marker. A bad form answer / missing consent / failed probe re-prompts
        the same step with an error. An oauth step (WS-8) re-prompts itself with a
        "waiting" note (poll again) until the admin's browser completes the vendor
        authorization and hits the oauth callback route; once that has recorded a
        token, Next advances past it like any other step. Admin only.
      parameters:
      - description: extension id
        in: path
        name: id
        required: true
        type: string
      - description: wizard session id
        in: path
        name: session
        required: true
        type: string
      - description: step answers
        in: body
        name: body
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-extension_WizardStepView'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Advance extension install wizard
      tags:
      - extension
  /v4/extensions/{id}/wizard/start:
    post:
      description: Opens a declarative install-wizard session driven by the extension's
        Manifest.Wizard and returns the first step. Admin only. Returns 404 if the
        extension is not installed or declares no wizard.
      parameters:
      - description: extension id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-extension_WizardStepView'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Start extension install wizard
      tags:
      - extension
  /v4/extensions/contributions:
    get:
      description: Merges the declarative front-end contributions (config forms, menu
        actions, previewers, ui panels, dashboard cards, ...) of every ENABLED extension
        into one versioned document. Built-in drivers appear with an empty contributions
        block. The output changes as plugins are installed/enabled/disabled/uninstalled.
        Requires a logged-in user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-extension_ContributionsDoc'
      security:
      - ApiKeyAuth: []
      summary: Aggregate extension contributions
      tags:
      - extension
  /v4/extensions/oauth/callback:
    get:
      description: Validates state against the wizard session that requested it, then
        exchanges code for a token by calling the AuthProvider plugin directly — locally,
        never through an external broker — and records the token as that oauth step's
        answer. Does not itself advance the wizard session; the frontend's main tab
        still calls wizard/next to continue once it learns the callback completed.
      parameters:
      - description: authorization code
        in: query
        name: code
        required: true
        type: string
      - description: anti-CSRF state minted by the wizard's oauth step
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-extension_WizardStepView'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.Resp-any'
      summary: OAuth callback for an extension install wizard
      tags:
      - extension
  /v4/fs/add_offline_download:
    post:
      consumes:
