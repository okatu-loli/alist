basePath: /api
definitions:
  archive.ArchiveMeta:
    properties:
      comment:
        type: string
      encrypted:
        type: boolean
      entry_count:
        type: integer
      total_uncompressed_size:
        type: integer
    type: object
  archive.Entry:
    properties:
      is_dir:
        type: boolean
      modified:
        type: string
      name:
        type: string
      size:
        type: integer
    type: object
  backup.DomainDiff:
    properties:
      create:
        items:
          type: string
        type: array
      delete:
        items:
          type: string
        type: array
      update:
        items:
          type: string
        type: array
    type: object
  backup.KDFParams:
    properties:
      algo:
        description: '"pbkdf2-sha256"'
        type: string
      iterations:
        description: pbkdf2 rounds
        type: integer
      key_len:
        description: derived key length in bytes (32 = AES-256)
        type: integer
      salt:
        description: base64 std encoding
        type: string
    type: object
  backup.Manifest:
    properties:
      created_at:
        type: string
      domains:
        additionalProperties:
          type: integer
        description: domain name -> row count
        type: object
      encrypted:
        type: boolean
      format_version:
        type: integer
      has_secrets_key:
        description: |-
          HasSecretsKey records whether the archive's secrets.key member carries
          the shared secrets key (G4 §4) — never the key itself, which stays
          inside the encrypted member. Recording only a bool in the always-
          plaintext manifest is safe: it tells restore whether to expect the
          member without revealing anything about the key.
        type: boolean
      kdf:
        $ref: '#/definitions/backup.KDFParams'
      sanitized:
        type: boolean
      schema_version:
        type: string
    type: object
  backup.RestoreDiff:
    properties:
      domains:
        additionalProperties:
          $ref: '#/definitions/backup.DomainDiff'
        type: object
      dry_run:
        type: boolean
      strategy:
        type: string
    type: object
  common.PageResp:
    properties:
