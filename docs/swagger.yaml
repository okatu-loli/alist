  /v4/fs/archive/extract:
    get:
      description: 'Dispatched by file extension to a registered ArchiveTool (built-in
        zip, or an installed plugin). Streams the inner file''s bytes directly (Content-Disposition:
        inline). A single entry''s declared uncompressed size is capped; the entry
        itself is streamed, never buffered whole.'
      parameters:
      - description: archive file path
        in: query
        name: path
        required: true
        type: string
      - description: inner file path within the archive
        in: query
        name: inner
        required: true
        type: string
      - description: archive password (reserved -- unused for std zip)
        in: query
        name: password
        type: string
      responses:
        "200":
          description: the inner file's raw bytes
          schema:
            type: file
        "400":
          description: missing path/inner, or inner path is a directory
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: no read permission on path
          schema:
            $ref: '#/definitions/common.Resp-any'
        "404":
          description: not found, not a zip archive, or inner path not found
          schema:
            $ref: '#/definitions/common.Resp-any'
        "422":
          description: encrypted entry, or exceeds a safety cap
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Extract one file from a zip archive
      tags:
      - fs
  /v4/fs/archive/list:
    get:
      description: 'Dispatched by file extension to a registered ArchiveTool (built-in
        zip, or an installed plugin). Virtual-directory view: returns direct children
        of `inner` only, not the whole flat entry list. op.Authorize(ActRead) on path
        is the sole access boundary.'
      parameters:
      - description: archive file path
        in: query
        name: path
        required: true
        type: string
      - description: inner directory path within the archive (root if empty)
        in: query
        name: inner
        type: string
      - description: archive password (reserved -- unused for std zip)
        in: query
        name: password
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-array_archive_Entry'
        "400":
          description: missing path
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: no read permission on path
          schema:
            $ref: '#/definitions/common.Resp-any'
        "404":
          description: not found, not a zip archive, or inner path not found
          schema:
            $ref: '#/definitions/common.Resp-any'
        "422":
          description: zip exceeds a safety cap
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: List a zip archive's inner directory
      tags:
      - fs
  /v4/fs/archive/meta:
    get:
      description: Dispatched by file extension to a registered ArchiveTool (built-in
        zip, or an installed plugin). op.Authorize(ActRead) on path is the sole access
        boundary.
      parameters:
      - description: archive file path
        in: query
        name: path
        required: true
        type: string
      - description: archive password (reserved -- unused for std zip, which cannot
          decrypt)
        in: query
        name: password
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
