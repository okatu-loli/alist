      tags:
      - task
  /task/upload/retry_failed:
    post:
      description: Retries every failed task belonging to the caller (or every user's,
        if admin).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Retry failed tasks
      tags:
      - task
  /task/upload/retry_some:
    post:
      consumes:
      - application/json
      description: Retries each task id in the body. Ids that don't exist, or aren't
        owned by a non-admin caller, are reported in the response map rather than
        failing the whole request.
      parameters:
      - description: task ids
        in: body
        name: body
        required: true
        schema:
          items:
            type: string
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: 'data: map of task id -> error message, only for ids that failed'
          schema:
            $ref: '#/definitions/common.Resp-map_string_string'
        "400":
          description: invalid request format
          schema:
            $ref: '#/definitions/common.Resp-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Retry tasks (batch)
      tags:
      - task
  /task/upload/undone:
    get:
      description: Returns tasks in a not-yet-finished state (pending/running/canceling/errored/failing/waiting_retry/before_retry).
        Admins see every user's tasks; other users see only their own.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-array_handles_TaskInfo'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: List undone tasks
      tags:
      - task
  /v4/admin/agent-tasks:
    get:
