      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-handles_CreateBackupResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Create backup
      tags:
      - admin_backup
  /v4/admin/backup/{name}:
    delete:
      description: Deletes the named backup archive. Admin only.
      parameters:
      - description: backup file name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Delete backup
      tags:
      - admin_backup
  /v4/admin/backup/{name}/download:
    get:
      description: Streams the named backup archive (tar.gz). Admin only.
      parameters:
      - description: backup file name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/gzip
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Download backup
      tags:
      - admin_backup
  /v4/admin/backup/restore:
    post:
      consumes:
      - application/json
      description: Restores the named backup with merge or overwrite semantics, or
        previews the diff when dry_run is true. A non-dry-run restore first snapshots
        current state (pre-restore-<ts>.tar.gz) and applies everything in one transaction.
        Restart the server afterwards so in-memory caches and storage drivers reload
        from the restored database. Admin only.
      parameters:
      - description: restore options
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.RestoreBackupReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-backup_RestoreDiff'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Restore backup
      tags:
      - admin_backup
  /v4/admin/drivers:
    get:
      consumes:
