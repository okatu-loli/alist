    - AlgMLDSA87
    - AlgESP384
    - AlgESP512
    - AlgRS256
    - AlgRS384
    - AlgRS512
    - AlgRS1
info:
  contact: {}
  description: |-
    AList V4 HTTP API. All endpoints return the common envelope
    `{"code": int, "message": string, "data": T}`; a `code` of 200 means success.
    Authenticated endpoints require the `Authorization` header set to the access
    token returned by `/api/auth/login` (or `/api/auth/login/hash`).
    Base URL is `conf.URL.Path` (empty by default) followed by `/api`, e.g. `/api/me`.
  license:
    name: AGPL-3.0
    url: https://github.com/alist-org/alist/blob/main/LICENSE
  termsOfService: https://alistgo.com/
  title: AList V4 API
  version: "4.0"
paths:
  /../d/{path}:
    get:
      description: Resolves the storage's direct link for the signed path and issues
        a 302 redirect to it; proxies through the server instead when the storage
        requires it (WebProxy/must-proxy/proxy_types, etc). Mounted at the top-level
        route (not under /api) as GET and HEAD /d/{path}; the path must carry a valid
        `sign` query parameter (see middlewares.Down) rather than an Authorization
        header.
      parameters:
      - description: storage-relative file path
        in: path
        name: path
        required: true
        type: string
      - description: path signature, see /admin/signing_key
        in: query
        name: sign
        required: true
        type: string
      - description: link type hint passed through to the driver
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: redirect to the resolved direct link
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      summary: Download (redirect)
      tags:
      - download
  /../favicon.ico:
    get:
      description: Redirects to the site's configured favicon URL. Mounted at the
        top-level route (not under /api).
      produces:
      - application/json
      responses:
        "302":
          description: redirect to the favicon URL
          schema:
            type: string
      summary: Favicon
      tags:
      - public
  /../i/{link_name}:
    get:
      description: Decodes the base64-encoded `{link}/{name}` payload in link_name
        and returns an Apple OTA-install .plist manifest referencing it. Mounted at
        the top-level route (not under /api).
      parameters:
      - description: base64-encoded \
        in: path
        name: link_name
        required: true
        type: string
      produces:
      - text/xml
      responses:
        "200":
          description: application/xml plist manifest
          schema:
            type: string
        "400":
          description: malformed link_name
          schema:
            $ref: '#/definitions/common.Resp-any'
      summary: iOS OTA install manifest
      tags:
      - public
  /../p/{path}:
    get:
      description: Streams the file content through this server instead of redirecting.
        Markdown files are additionally rendered to sanitized HTML when the filter-readme-scripts
        setting is on. Mounted at the top-level route (not under /api) as GET and
        HEAD /p/{path}; the path must carry a valid `sign` query parameter (see middlewares.Down)
        rather than an Authorization header.
      parameters:
      - description: storage-relative file path
        in: path
        name: path
        required: true
        type: string
      - description: path signature, see /admin/signing_key
        in: query
        name: sign
        required: true
        type: string
      - description: link type hint passed through to the driver
        in: query
        name: type
        type: string
      - description: presence disables redirect to the storage's down_proxy_url
        in: query
        name: d
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: file content
          schema:
            type: file
        "403":
          description: proxy not allowed for this storage/file type
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      summary: Download (proxied through server)
      tags:
      - download
  /../ping:
    get:
      description: Liveness check; always replies "pong". Mounted at the top-level
        route (not under /api).
      produces:
      - text/plain
      responses:
        "200":
          description: pong
          schema:
            type: string
      summary: Ping
      tags:
      - public
  /../plugin-assets/{id}/{filepath}:
    get:
      description: Read-only static file from an enabled plugin's active version dir,
        for theme token/css/font/image assets. Anonymous (loaded as css subresources).
        File type is allowlisted (json/css/woff2/images); path traversal and non-enabled
        plugins are rejected.
      parameters:
      - description: extension id
        in: path
        name: id
        required: true
        type: string
      - description: asset path within the plugin dir
        in: path
        name: filepath
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.Resp-any'
      summary: Serve a plugin theme asset
      tags:
      - extension
  /../robots.txt:
    get:
      description: Returns the configured robots.txt content. Mounted at the top-level
        route (not under /api).
      produces:
      - text/plain
      responses:
        "200":
          description: robots.txt content
          schema:
            type: string
      summary: robots.txt
      tags:
      - public
  /admin/driver/info:
    get:
      consumes:
      - application/json
      description: Returns the config item schema for a single driver by name.
      parameters:
      - description: driver name
        in: query
        name: driver
        required: true
        type: string
      - description: driver name
        in: path
        name: driver
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'data: []driver.Item'
          schema:
            $ref: '#/definitions/common.Resp-any'
        "404":
          description: driver not found
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Get driver info
      tags:
      - admin-driver
  /admin/driver/list:
    get:
      consumes:
      - application/json
      description: Returns the config item schema for every registered storage driver,
        keyed by driver name.
      produces:
      - application/json
      responses:
        "200":
          description: 'data: map[string][]driver.Item'
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: List driver info
      tags:
      - admin-driver
  /admin/driver/names:
    get:
      consumes:
      - application/json
      description: Returns the names of all registered storage drivers.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-array_string'
      security:
      - ApiKeyAuth: []
      summary: List driver names
      tags:
      - admin-driver
  /admin/meta/create:
    post:
      consumes:
      - application/json
      description: Creates a new path metadata rule. The Hide field is validated as
        newline-separated regexp2 patterns.
      parameters:
      - description: meta to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.Meta'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: invalid body or invalid Hide regexp
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Create meta
      tags:
      - admin-meta
  /admin/meta/delete:
    post:
      consumes:
      - application/json
      description: Deletes a path metadata rule by ID.
      parameters:
      - description: meta id
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Delete meta
      tags:
      - admin-meta
  /admin/meta/get:
    get:
      consumes:
      - application/json
      description: Returns a single path metadata rule by ID.
      parameters:
      - description: meta id
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-model_Meta'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Get meta
      tags:
      - admin-meta
  /admin/meta/list:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of path metadata rules (hide/password/readme/header
        settings per path).
      parameters:
      - description: page number
        in: query
        name: page
        type: integer
      - description: page size
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: data.content is []model.Meta
          schema:
            $ref: '#/definitions/common.Resp-common_PageResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: List metas
      tags:
      - admin-meta
  /admin/meta/update:
    post:
      consumes:
      - application/json
      description: Updates an existing path metadata rule (matched by ID in the body).
        The Hide field is validated as newline-separated regexp2 patterns.
      parameters:
      - description: meta to update, including id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.Meta'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: invalid body or invalid Hide regexp
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Update meta
      tags:
      - admin-meta
  /admin/permission/catalog:
    get:
      consumes:
      - application/json
      description: Returns the action vocabulary (resource types, system domains,
        and all action definitions incl. implies/danger/source/orphaned) the permission
        editor renders from.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Permission action catalog
      tags:
      - admin-permission
  /admin/permission/create:
    post:
      consumes:
      - application/json
      description: Creates a new permission row. Origin is always forced to "manual"
        server-side, since "scope"-origin rows are exclusively produced by role sync.
      parameters:
      - description: permission to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.Permission'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-model_Permission'
        "400":
          description: invalid body, or effect not allow/deny
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Create permission
      tags:
      - admin-permission
  /admin/permission/delete:
    post:
      consumes:
      - application/json
      description: Deletes a permission row by ID.
      parameters:
      - description: permission id
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Delete permission
      tags:
      - admin-permission
  /admin/permission/get:
    get:
      consumes:
      - application/json
      description: Returns a single permission row by ID.
      parameters:
      - description: permission id
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-model_Permission'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Get permission
      tags:
      - admin-permission
  /admin/permission/list:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of permission rows.
      parameters:
      - description: page number
        in: query
        name: page
        type: integer
      - description: page size
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: data.content is []model.Permission
          schema:
            $ref: '#/definitions/common.Resp-common_PageResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: List permissions
      tags:
      - admin-permission
  /admin/permission/roles:
    get:
      consumes:
      - application/json
      description: Returns the IDs of roles whose permission_scopes reference the
        given permission (reverse lookup).
      parameters:
      - description: permission id
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-array_uint'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Permission roles
      tags:
      - admin-permission
  /admin/permission/update:
    post:
      consumes:
      - application/json
      description: Updates an existing permission row (matched by ID in the body).
        Only non-empty/non-nil fields are applied. Origin is not client-editable.
      parameters:
      - description: permission fields to update, including id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.UpdatePermissionReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: invalid body, or effect not allow/deny
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Update permission
      tags:
      - admin-permission
  /admin/role/create:
    post:
      consumes:
      - application/json
      description: Creates a new role with the given name, description and permission
        scopes.
      parameters:
      - description: role to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.Role'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Create role
      tags:
      - admin-role
  /admin/role/delete:
    post:
      consumes:
      - application/json
      description: Deletes a role by ID. The built-in "admin" and "guest" roles cannot
        be deleted.
      parameters:
      - description: role id
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: cannot delete built-in admin/guest role
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Delete role
      tags:
      - admin-role
  /admin/role/get:
    get:
      consumes:
      - application/json
      description: Returns a single role by ID.
      parameters:
      - description: role id
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-model_Role'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Get role
      tags:
      - admin-role
  /admin/role/list:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of roles.
      parameters:
      - description: page number
        in: query
        name: page
        type: integer
      - description: page size
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: data.content is []model.Role
          schema:
            $ref: '#/definitions/common.Resp-common_PageResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: List roles
      tags:
      - admin-role
  /admin/role/permissions:
    get:
      consumes:
      - application/json
      description: Returns the permission rows bound to the given role (scope + manual).
      parameters:
      - description: role id
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-array_model_Permission'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Role permissions
      tags:
      - admin-role
  /admin/role/set_permissions:
    post:
      consumes:
      - application/json
      description: Replaces the set of permission IDs associated with the given role.
      parameters:
      - description: role id and permission ids to associate
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.SetRolePermissionsReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Set role permissions
      tags:
      - admin-role
  /admin/role/update:
    post:
      consumes:
      - application/json
      description: 'Updates an existing role (matched by ID in the body): name, description,
        permission_scopes and default flag. The built-in "admin" role cannot be renamed/modified;
        the built-in "guest" role''s name cannot be changed.'
      parameters:
      - description: 'role update payload: {id, name, description, permission_scopes:
          []model.PermissionEntry, default}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: cannot change the built-in admin role
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Update role
      tags:
      - admin-role
  /admin/session/evict:
    post:
      consumes:
      - application/json
      description: Marks the given session inactive regardless of owner, forcing that
        device to re-authenticate.
      parameters:
      - description: session id to evict
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.EvictSessionReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Evict session (admin)
      tags:
      - admin-session
  /admin/session/list:
    get:
      consumes:
      - application/json
      description: Returns all device sessions across all users.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-array_handles_SessionResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: List all sessions (admin)
      tags:
      - admin-session
  /admin/setting/delete:
    post:
      consumes:
      - application/json
      description: Deletes a setting item by key.
      parameters:
      - description: setting key
        in: query
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Delete setting
      tags:
      - admin-setting
  /admin/setting/get:
    get:
      consumes:
      - application/json
      description: Returns a single setting item by key, or multiple items by a comma-separated
        "keys" list. If neither is set, behavior depends on empty key/keys lookup.
        The default-role setting is enriched with role name and available role options;
        the offline_download_tool setting is enriched with the built-in tools plus
        any currently-enabled gRPC tool plugin names.
      parameters:
      - description: setting key (single lookup)
        in: query
        name: key
        type: string
      - description: comma-separated setting keys (batch lookup)
        in: query
        name: keys
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: single item when key is set
          schema:
            $ref: '#/definitions/common.Resp-model_SettingItem'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Get setting(s)
      tags:
      - admin-setting
  /admin/setting/list:
    get:
      consumes:
      - application/json
      description: Returns all setting items, or those filtered by a single "group"
        or comma-separated "groups" list. The default-role setting, if present, is
        enriched with role name and available role options; the offline_download_tool
        setting, if present, is enriched with the built-in tools plus any currently-enabled
        gRPC tool plugin names.
      parameters:
      - description: setting group id
        in: query
        name: group
        type: integer
      - description: comma-separated setting group ids
        in: query
        name: groups
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-array_model_SettingItem'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: List settings
      tags:
      - admin-setting
  /admin/setting/reset_token:
    post:
      consumes:
      - application/json
      description: Generates a new random admin API token and saves it, replacing
        the previous one. By default the token is stored as a salted hash (irreversible);
        pass reveal=true to store it in plaintext instead. The plaintext value is
        always returned once in the response, regardless of storage mode.
      parameters:
      - description: store the new token in plaintext (readable back via GET token)
          instead of hashed
        in: query
        name: reveal
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: 'data: new token (plaintext, shown once)'
          schema:
            $ref: '#/definitions/common.Resp-string'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Reset admin token
      tags:
      - admin-setting
  /admin/setting/save:
    post:
      consumes:
      - application/json
      description: Upserts a batch of setting items. If a default-role item is included,
        its value is resolved from a role name to a role id (admin/guest are rejected),
        and the site index is refreshed on success.
      parameters:
      - description: setting items
        in: body
        name: body
        required: true
        schema:
          items:
            $ref: '#/definitions/model.SettingItem'
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: invalid body, unknown default role, or admin/guest as default
            role
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Save settings
      tags:
      - admin-setting
  /admin/setting/set_token:
    post:
      consumes:
      - application/json
      description: Sets the admin API token to a caller-supplied value, replacing
        the previous one. By default the token is stored as a salted hash (irreversible);
        pass reveal=true to store it in plaintext instead. The plaintext value is
        always returned once in the response, regardless of storage mode.
      parameters:
      - description: new token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.SetTokenReq'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: new token (plaintext, shown once)'
          schema:
            $ref: '#/definitions/common.Resp-string'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Set admin token
      tags:
      - admin-setting
  /admin/setting/token:
    get:
      consumes:
      - application/json
      description: Returns the current admin API token if it is stored in plaintext,
