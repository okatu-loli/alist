      description: Queues one background download task per URL into the target directory
        (path is joined with the caller's base path). Requires ActWrite and ActOfflineDownload
        on path. tool selects the download backend; empty falls back to the offline_download_tool
        setting (default SimpleHttp).
      parameters:
