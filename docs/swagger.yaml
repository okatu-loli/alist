      tags:
      - admin_agent
  /v4/admin/agents/{id}/pairing-sas:
    get:
      description: Returns the SAS this server derived for the agent's current pairing
        attempt, for the admin to visually match against the agent's own terminal
        before confirming. Admin only.
      parameters:
      - description: agent id
        in: path
        name: id
        required: true
        type: integer
