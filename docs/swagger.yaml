            $ref: '#/definitions/common.Resp-handles_AgentDTO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Confirm a paired agent's SAS
      tags:
      - admin_agent
  /v4/admin/agents/{id}/logs:
    get:
      description: Pulls recent log lines from a reverse-connected agent over the
        authenticated channel. Admin only. Fails closed if the agent is not connected.
      parameters:
      - description: agent id
        in: path
        name: id
        required: true
        type: integer
      - description: return entries with seq greater than this cursor
        in: query
        name: since
