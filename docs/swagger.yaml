      - admin_agent
  /v4/admin/agents/{id}/tasks:
    get:
      description: Lists the delegated tasks for one agent with status/progress, newest
        first. Admin only.
      parameters:
      - description: agent id
        in: path
        name: id
        required: true
        type: integer
      - description: page size (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: page offset
        in: query
        name: offset
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-array_handles_AgentTaskProgressDTO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: List an agent's dispatched tasks with progress
      tags:
      - admin_agent
  /v4/admin/agents/pairing:
    post:
      description: Mints a high-entropy, 15-minute pairing code an operator hands
        to a not-yet-paired agent. Admin only.
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-handles_PairingStartResp'
      security:
      - ApiKeyAuth: []
      summary: Start agent pairing
      tags:
      - admin_agent
  /v4/admin/agents/pairing/reverse:
    post:
      description: Admin-only. Looks up a token minted by .../pairing/reverse/token
        by token_id, dials the agent's public /agentpair endpoint, runs the token
        pairing handshake, and on a passing mutual verify creates an auto-enabled
        reverse agent row. The reverse_addr is the agent's base ws/wss serve address.
      parameters:
      - description: reverse pairing target
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.ReverseStartAgentPairingReq'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-handles_ReverseStartAgentPairingResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Start reverse agent pairing
      tags:
      - admin_agent
  /v4/admin/agents/pairing/reverse/token:
    post:
      description: Admin-only. Mints a high-entropy one-time token (10-min TTL, single-use)
        for the operator to copy into the agent's pairing web, and returns it with
        an opaque token_id used by the reverse-pairing dial.
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-handles_ReverseMintPairingTokenResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Mint a reverse-pairing token
      tags:
      - admin_agent
  /v4/admin/audit:
    get:
      description: Query the audit trail (authorization decisions and security events),
        newest first. Admin only.
      parameters:
      - description: page number
        in: query
        name: page
        type: integer
      - description: page size
        in: query
        name: per_page
        type: integer
      - description: filter by acting user id
        in: query
        name: actor_uid
        type: integer
      - description: dotted action prefix, e.g. fs. or system.user.
        in: query
        name: action
        type: string
      - description: entry protocol, e.g. http
        in: query
        name: protocol
        type: string
      - description: allow / deny / success / failure
        in: query
        name: result
        type: string
      - description: RFC 3339 lower bound
        in: query
        name: from
        type: string
      - description: RFC 3339 upper bound
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-common_PageResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: List audit logs
      tags:
      - admin_audit
  /v4/admin/backup:
    get:
      description: Lists backup archives in the server's backup directory (name, size,
        mtime), newest first. Admin only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-array_handles_BackupFile'
