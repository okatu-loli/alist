  /fs/form:
    put:
      consumes:
      - multipart/form-data
      description: Runs behind middlewares.FsUp and the upload rate limiter. The destination
        path is joined with the caller's base path. Rejected if the target storage
        has NoUpload set. If As-Task is true, the upload is queued as a background
        task instead of completing synchronously.
      parameters:
      - description: URL-escaped destination path, joined with the caller's base path
        in: header
        name: File-Path
        required: true
        type: string
      - description: modification time in Unix milliseconds; defaults to now if absent/invalid
        in: header
        name: Last-Modified
        type: integer
      - description: if \
        in: header
        name: As-Task
        type: boolean
      - description: if \
        in: header
        name: Overwrite
        type: boolean
      - description: expected MD5 hash of the content
        in: header
        name: X-File-Md5
        type: string
      - description: expected SHA1 hash of the content
        in: header
        name: X-File-Sha1
        type: string
      - description: expected SHA256 hash of the content
        in: header
        name: X-File-Sha256
        type: string
      - description: file content
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 'data: {} or {task: TaskInfo} when As-Task is true'
          schema:
            $ref: '#/definitions/common.Resp-gin_H'
        "400":
          description: bad File-Path or storage lookup failure
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: no permission or file exists
          schema:
            $ref: '#/definitions/common.Resp-any'
        "405":
          description: storage does not support upload
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Upload file (multipart form)
      tags:
      - fs
