  /v4/admin/settings/token:
    get:
      consumes:
      - application/json
      description: Returns the current admin API token if it is stored in plaintext,
        or plaintext:false with an empty token if it is stored hashed.
      produces:
      - application/json
      responses:
        "200":
          description: 'data: {token, plaintext}'
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Get admin token
      tags:
      - admin-setting
    put:
      consumes:
      - application/json
      description: Sets the admin API token to a caller-supplied value, replacing
        the previous one. By default the token is stored as a salted hash (irreversible);
        pass reveal=true to store it in plaintext instead. The plaintext value is
        always returned once in the response, regardless of storage mode.
      parameters:
      - description: new token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.SetTokenReq'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: new token (plaintext, shown once)'
          schema:
            $ref: '#/definitions/common.Resp-string'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Set admin token
      tags:
      - admin-setting
