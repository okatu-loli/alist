  /v4/admin/users:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of users.
      parameters:
      - description: page number
        in: query
        name: page
        type: integer
      - description: page size
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: data.content is []model.User
          schema:
            $ref: '#/definitions/common.Resp-common_PageResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: List users
      tags:
      - admin-user
    post:
      consumes:
      - application/json
      description: Creates a new user. Cannot be used to create an admin or guest
        user; if no role is given, the default role is assigned.
      parameters:
      - description: user to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.User'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: invalid body, or attempted to create admin/guest user
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Create user
      tags:
      - admin-user
