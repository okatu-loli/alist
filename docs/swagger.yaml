        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-handles_AgentPairingSASResp'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
