      consumes:
      - application/json
      description: Anonymous but self-authenticated by an ed25519 signature over agent_id|ts|nonce.
        Rejects a stale ts, a replayed nonce, an unknown agent, or a disabled agent.
      parameters:
      - description: signed heartbeat
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.AgentHeartbeatReq'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-handles_AgentHeartbeatResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/common.Resp-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.Resp-any'
      summary: Agent heartbeat
      tags:
      - agent
  /v4/agent/pair/complete:
    post:
      consumes:
      - application/json
      description: 'Anonymous, rate-limited: the pairing code is the credential. Validates
        the code (single-use, uniform invalid/expired error), derives AgentID from
        the submitted ed25519 pubkey, and creates or updates the paired agent row
        — always Enabled=false/unconfirmed pending an admin''s SAS-matched confirm
        (POST /admin/agents/:id/confirm).'
      parameters:
      - description: pairing completion
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.PairAgentCompleteReq'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-handles_PairAgentCompleteResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/common.Resp-any'
      summary: Complete agent pairing
      tags:
      - agent
  /v4/agent/task/{id}/content:
    put:
      description: Anonymous, cap_token-authed via the Agent-Cap-Token header (query-string
        form intentionally unsupported — see handler doc). Re-verifies the whitelist
        and write-authorization for the creator on every call. Streams straight to
        storage — never buffers the whole body in memory.
      parameters:
      - description: task id
        in: path
        name: id
        required: true
        type: string
      - description: capability token
        in: header
        name: Agent-Cap-Token
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/common.Resp-any'
      summary: Upload a task's file content
      tags:
      - agent
  /v4/agent/task/{id}/progress:
    post:
      description: Anonymous, cap_token-authed.
      parameters:
      - description: task id
        in: path
        name: id
        required: true
        type: string
      - description: progress update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.AgentTaskProgressReq'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-handles_AgentTaskDTO'
      summary: Report task progress
      tags:
      - agent
  /v4/agent/task/{id}/rapid:
    post:
      description: Anonymous, cap_token-authed. Re-verifies the whitelist and BOTH
        read(src)+write(dst) authorization for the creator on every call. Returns
        rapid=true on a hash hit (no bytes moved), rapid=false to fall back to streaming.
      parameters:
      - description: task id
        in: path
        name: id
        required: true
        type: string
      - description: capability token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.AgentTaskTryRapidReq'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-handles_AgentTaskTryRapidResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/common.Resp-any'
      summary: Try a hash-based rapid-upload for a task
      tags:
      - agent
  /v4/agent/task/{id}/renew:
    post:
      description: Anonymous, cap_token-authed. Re-verifies the whitelist and BOTH
        read(src)+write(dst) authorization for the creator on every call, exactly
        like try-rapid, then reissues a fresh token scoped to the same task.
      parameters:
      - description: task id
        in: path
        name: id
        required: true
        type: string
      - description: capability token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.AgentTaskRenewCapReq'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-handles_AgentTaskRenewCapResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/common.Resp-any'
      summary: Renew a task's capability token
      tags:
      - agent
  /v4/agent/task/{id}/src-link:
    post:
      description: Anonymous, cap_token-authed. Re-verifies the whitelist and read-authorization
        for the creator on every call.
      parameters:
      - description: task id
        in: path
        name: id
        required: true
        type: string
      - description: capability token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.AgentTaskSrcLinkReq'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-handles_AgentTaskSrcLinkResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/common.Resp-any'
      summary: Get a task's source download link
      tags:
      - agent
  /v4/agent/task/{id}/status:
    post:
      description: Anonymous, cap_token-authed. status must be one of running|done|failed.
      parameters:
      - description: task id
        in: path
        name: id
        required: true
        type: string
      - description: status update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.AgentTaskStatusReq'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-handles_AgentTaskDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
      summary: Report task status
      tags:
      - agent
  /v4/agent/tasks:
    post:
      description: Delegates a cross-drive copy to a paired, enabled agent whose storage
        whitelist covers both src and dst, and for which the caller is themselves
        authorized (read src, write dst). Authed (any user, not admin-only).
      parameters:
      - description: task
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.CreateAgentTaskReq'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-handles_AgentTaskDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/common.Resp-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Create an agent task
      tags:
      - agent
  /v4/auth/login:
    post:
      consumes:
      - application/json
      description: 'Deprecated: use LoginHash instead, which hashes the password on
        the client before sending it.'
      parameters:
      - description: username/password credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: {token, refresh_token, device_key}'
          schema:
            $ref: '#/definitions/common.Resp-gin_H'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "402":
          description: 'second factor required: data carries {need_second_factor,
            method_id, challenge_id} — complete it at POST /auth/login/2fa'
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: too many devices
          schema:
            $ref: '#/definitions/common.Resp-any'
        "429":
          description: too many failed attempts
          schema:
            $ref: '#/definitions/common.Resp-any'
      summary: Login (deprecated)
      tags:
      - auth
  /v4/auth/login-methods:
    get:
      description: Flattens the login_methods contribution of every ENABLED extension
        into one public, anonymous list (plugin id + render metadata only). Drives
        the login page's rendering of non-built-in login affordances (federated SSO-like
        methods, primary/second-factor methods declared by a plugin). No secrets are
        exposed.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-array_handles_publicLoginMethod'
      summary: List public login methods
      tags:
      - auth
  /v4/auth/login/2fa:
    post:
      consumes:
      - application/json
      description: Verifies a login step-up challenge's code (a current TOTP code
        or an unused recovery code) and, on success, issues a session token. Anonymous
        by necessity (no session exists yet) — the challenge id, minted only after
        a correct password, is the access control. Compatibility alias for POST /auth/method/builtin.totp/stepup/finish.
      parameters:
      - description: challenge id + code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.LoginTOTPStepUpReq'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: {token, refresh_token, device_key}'
          schema:
            $ref: '#/definitions/common.Resp-gin_H'
        "400":
          description: wrong/expired code or challenge
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: resolved user disabled since the challenge was minted
          schema:
            $ref: '#/definitions/common.Resp-any'
        "429":
          description: too many failed attempts
          schema:
            $ref: '#/definitions/common.Resp-any'
      summary: Complete a TOTP login step-up
      tags:
      - auth
  /v4/auth/login/hash:
    post:
      consumes:
      - application/json
      description: Login using a password pre-hashed by the client with SHA256 (see
        model.StaticHash), avoiding sending the plaintext password over the wire.
      parameters:
      - description: username/hashed-password credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: {token, refresh_token, device_key}'
          schema:
            $ref: '#/definitions/common.Resp-gin_H'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "402":
          description: 'second factor required: data carries {need_second_factor,
            method_id, challenge_id} — complete it at POST /auth/login/2fa'
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: too many devices
          schema:
            $ref: '#/definitions/common.Resp-any'
        "429":
          description: too many failed attempts
          schema:
            $ref: '#/definitions/common.Resp-any'
      summary: Login with hashed password
      tags:
      - auth
  /v4/auth/logout:
    post:
      consumes:
      - application/json
      description: Marks the caller's device session inactive and invalidates the
        presented access token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Logout
      tags:
      - auth
  /v4/auth/method/{id}/begin:
    post:
      consumes:
      - application/json
      description: Starts an installed login method's challenge (federated redirect
        URL, LDAP prompt). Anonymous; only primary/federated methods are usable here
        — a second-factor method is rejected (it runs after a password succeeds, never
        as a standalone login).
      parameters:
      - description: extension id of the login method
        in: path
        name: id
        required: true
        type: string
      - description: method-specific client inputs
        in: body
        name: body
        schema:
          $ref: '#/definitions/handles.AuthNMethodBeginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-handles_AuthNMethodBeginResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "404":
          description: no such enabled login method
          schema:
            $ref: '#/definitions/common.Resp-any'
      summary: Begin a login-method challenge
      tags:
      - auth
  /v4/auth/method/{id}/callback:
    get:
      responses: {}
  /v4/auth/method/{id}/finish:
    post:
      consumes:
      - application/json
      description: Verifies a login method's challenge response and, if the resolved
        identity passes the host's gates, issues a core session token. The plugin
        never issues the token. No login-method path can mint an admin session; federated
        auto-provisioning is gated by authn_auto_provision (default off).
      parameters:
      - description: extension id of the login method
        in: path
        name: id
        required: true
        type: string
      - description: challenge response
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.AuthNMethodFinishReq'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: {token, refresh_token, device_key}'
          schema:
            $ref: '#/definitions/common.Resp-gin_H'
        "400":
          description: verification failed / unknown user / provisioning disabled
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: resolved user is disabled or an admin (no login-method admin
            sessions)
          schema:
            $ref: '#/definitions/common.Resp-any'
        "404":
          description: no such enabled login method
          schema:
            $ref: '#/definitions/common.Resp-any'
        "429":
          description: too many failed attempts
          schema:
            $ref: '#/definitions/common.Resp-any'
      summary: Finish a login-method challenge
      tags:
      - auth
  /v4/auth/method/{id}/link:
    post:
      responses: {}
  /v4/auth/method/{id}/stepup/finish:
    post:
      consumes:
      - application/json
      description: Verifies a second-factor AuthNMethod's step-up challenge response
        (begun internally after a password/primary/federated login already succeeded)
        and, on success, issues a session token. Anonymous by necessity — the challenge
        id, minted only after the first factor succeeded, is the access control. Rejects
        a primary/federated method id with 400 — it has no step-up ceremony.
      parameters:
      - description: extension id of the second-factor method
        in: path
        name: id
        required: true
        type: string
      - description: challenge response
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.AuthNMethodStepUpFinishReq'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: {token, refresh_token, device_key}'
          schema:
            $ref: '#/definitions/common.Resp-gin_H'
        "400":
          description: verification failed / not a second-factor method
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: resolved user disabled / feature disabled
          schema:
            $ref: '#/definitions/common.Resp-any'
        "404":
          description: no such enabled method
          schema:
            $ref: '#/definitions/common.Resp-any'
        "429":
          description: too many failed attempts
          schema:
            $ref: '#/definitions/common.Resp-any'
      summary: Complete a second-factor step-up challenge
      tags:
      - auth
  /v4/auth/passkey:
    get:
      description: Lists the authenticated user's registered passkeys (name, created/last-used,
        no secret material). Not available to the guest user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-array_handles_PasskeyInfo'
        "403":
          description: guest user
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: List my passkeys
      tags:
      - auth
  /v4/auth/passkey/{credid}:
    delete:
      description: Removes the named passkey from the authenticated user's own account
        only. Not available to the guest user.
      parameters:
      - description: credential id (base64url) of the passkey to remove
        in: path
        name: credid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: guest user
          schema:
            $ref: '#/definitions/common.Resp-any'
        "404":
          description: no such passkey on the caller's account
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Delete one of my passkeys
      tags:
      - auth
  /v4/auth/passkey/register/begin:
    post:
      description: Starts a WebAuthn registration ceremony for the authenticated user;
        returns creation options for navigator.credentials.create. Not available to
        the guest user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-handles_PasskeyRegisterBeginResp'
        "403":
          description: guest user
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Begin passkey registration
      tags:
      - auth
  /v4/auth/passkey/register/finish:
    post:
      consumes:
      - application/json
      description: Verifies the attestation for the current user's registration ceremony
        and appends the passkey to their account. Not available to the guest user.
      parameters:
      - description: attestation response
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.PasskeyRegisterFinishReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-handles_PasskeyInfo'
        "400":
          description: verification failed / expired challenge
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: guest user
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Finish passkey registration
      tags:
      - auth
  /v4/auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchanges a refresh token for a new access+refresh token pair.
        The presented refresh token is rotated (revoked then replaced); reuse of an
        already-rotated token revokes the whole session.
      parameters:
      - description: refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.RefreshReq'
      produces:
      - application/json
      responses:
        "200":
          description: 'data: {token, refresh_token}'
          schema:
            $ref: '#/definitions/common.Resp-gin_H'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "401":
          description: invalid/expired refresh token, or session revoked
          schema:
            $ref: '#/definitions/common.Resp-any'
        "429":
          description: too many refresh attempts
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      summary: Refresh access token
      tags:
      - auth
  /v4/auth/sso/providers:
    get:
      responses: {}
  /v4/ext-public/{pluginid}/{proxypath}:
    get:
      parameters:
      - description: extension id
