  /v4/admin/extensions:
    get:
      description: 'Returns the unified extension-manager list: host-registered built-ins
        (labels/SSO/passkey/FRP…), listed even while disabled so they can be re-enabled,
        plus installed disk plugins. Admin only.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-handles_ManagedExtensionsResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: List managed extensions
      tags:
      - admin_extension
  /v4/admin/extensions/{id}/disable:
    post:
      description: Disables a host-registered built-in extension (its contributions
        stop aggregating; a BackgroundService is stopped) and records it in the persisted
        disabled set so the choice survives a restart. Rejects a disk-plugin or unknown
        id — those go through /admin/plugins. Admin only.
      parameters:
      - description: extension id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-string'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Disable built-in extension
      tags:
      - admin_extension
  /v4/admin/extensions/{id}/enable:
    post:
      description: Enables a host-registered built-in extension (its contributions
        re-aggregate; a BackgroundService restarts) and clears it from the persisted
        disabled set. Rejects a disk-plugin or unknown id — those go through /admin/plugins.
        Admin only.
      parameters:
      - description: extension id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-string'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Enable built-in extension
      tags:
      - admin_extension
