      - admin_agent
  /v4/admin/agents/{id}/reverse-status:
    get:
      description: Returns the live reverse-channel connection status for a reverse-mode
        agent. Admin only.
      parameters:
      - description: agent id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-handles_ReverseStatus'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Get an agent's reverse-connection status
