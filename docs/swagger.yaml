  extension.IndexEntry:
    properties:
      core_api:
        type: string
      id:
        type: string
      kind:
        $ref: '#/definitions/github_com_AlistGo_alist-ext.Kind'
      license:
        description: "Provenance fields (Step 11). The official index lists OPEN-SOURCE
          plugins\nonly; FetchIndex drops any entry that is closed-source or paid.
          Proprietary/\npaid plugins are installed only by URL/file, where the trust-tier
          gate\nforces them through the \U0001F534 risk path."
        type: string
      name:
        type: string
      pricing:
        type: string
      sha256:
        description: of the .tar.gz package at URL
        type: string
      sig:
        description: detached signature (base64), for out-of-band checks
        type: string
      source:
        description: |-
          Source is the name of the plugin source this entry came from ("official"
          or an imported source's name). Set by AggregateIndex, not by the index
          file itself.
        type: string
      source_url:
        type: string
      url:
        description: download URL of the package
        type: string
      version:
        type: string
    type: object
  extension.PermissionView:
    properties:
      granted:
        $ref: '#/definitions/extension.Grant'
      id:
        type: string
      needs_reconsent:
        type: boolean
      requested:
        $ref: '#/definitions/extension.RequestedPermissions'
      version:
        type: string
    type: object
  extension.PluginSource:
    properties:
      index_url:
        type: string
      name:
        type: string
      pubkey:
        description: ed25519 public key, hex
        type: string
    type: object
  extension.PluginState:
    properties:
      active_version:
        type: string
      config:
        description: |-
          Config is the persisted config_form values an admin set for this plugin
          (a JSON object). Stage 1: stored/served for the admin UI only — the plugin
          cannot yet read it back (the reverse host bridge is a later wave). Empty
          until an admin saves.
        items:
          type: integer
        type: array
      enabled:
        type: boolean
      exec_mode:
        description: chosen execution mode (grpc|in-process)
        type: string
      grant:
        allOf:
        - $ref: '#/definitions/extension.Grant'
        description: |-
          Grant is what the admin APPROVED for this plugin (design §6.2), persisted
          alongside the rest of the lifecycle state. It — not the Manifest — is the
          runtime authority: the dispatch gate and the borrowed-capability layer read
          it, so a capability the Manifest declares but the Grant omits is denied. Nil
          until consent is recorded; a nil Grant means default-deny at the gate, NOT
          "fall back to the Manifest". A direct install records a default Grant
          (grantFromManifest); a wizard/consent install or a post-install adjust
          overwrites it via SetGrant.
      id:
        type: string
      installed_at:
        type: string
      kind:
        $ref: '#/definitions/github_com_AlistGo_alist-ext.Kind'
      name:
        additionalProperties:
          type: string
        description: manifest i18n display name (LangMap); shown by the UI instead
          of the id
        type: object
      needs_reconsent:
        description: |-
          NeedsReconsent marks a plugin whose active version requests MORE than the
          current Grant approves (design §6.6, set by Update). The extra capabilities
          stay denied at runtime until the admin re-approves via SetGrant; the UI
          surfaces the flag so the admin knows re-consent is due.
        type: boolean
      previous_version:
        description: rollback target
        type: string
      tier:
        description: trust tier at install (official|verified|third-party)
        type: string
      updated_at:
        type: string
      versions:
        description: versions present on disk
        items:
          type: string
        type: array
    type: object
  extension.RequestedPermissions:
    properties:
      filesystem:
        type: string
      host_apis:
        items:
          type: string
        type: array
      network:
        items:
          type: string
        type: array
      storage_tokens:
        items:
          type: string
        type: array
    type: object
  extension.WizardStepView:
    properties:
      answers:
        additionalProperties: {}
        description: |-
          Answers carries the current step's own recorded answer (e.g. the oauth
          step's exchanged token, once HandleOAuthCallback has completed it) so a
          polling caller can pick it up without waiting for Done. Done responses
          carry every step's merged answers instead (the full config, credentials
          included, for the caller to use when creating the resulting storage).
        type: object
      auth_url:
        description: |-
          AuthURL is set when the current step is an oauth step awaiting
          authorization: the frontend opens it (e.g. in a popup) and waits for the
          provider to redirect the browser to the host's oauth callback (WS-8).
        type: string
      done:
        type: boolean
      error:
        type: string
      note:
        type: string
      session_id:
        type: string
      step:
        $ref: '#/definitions/github_com_AlistGo_alist-ext.WizardStep'
    type: object
  gin.H:
    additionalProperties: {}
    type: object
