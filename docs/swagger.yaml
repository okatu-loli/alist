            $ref: '#/definitions/common.Resp-any'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.Resp-any'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/common.Resp-any'
