        "400":
          description: missing path
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: no read permission on path
          schema:
            $ref: '#/definitions/common.Resp-any'
        "404":
          description: not found or not a zip archive
          schema:
            $ref: '#/definitions/common.Resp-any'
        "422":
          description: zip exceeds a safety cap (entry count / total size)
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Get zip archive meta-info
      tags:
      - fs
