      tags:
      - admin_plugin
  /v4/admin/plugins/sources/{name}:
    delete:
      description: Removes an imported plugin source by name. Installed plugins are
        kept, but on their next enable they are re-classified against the remaining
        trust roots (a plugin vouched only by the removed source drops to third-party).
        The built-in official source cannot be removed. Admin only.
      parameters:
      - description: source name
        in: path
        name: name
        required: true
        type: string
