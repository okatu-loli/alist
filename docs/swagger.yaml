    post:
      consumes:
      - application/json
      description: Installs a plugin from a local .tar.gz path or a URL. The package
        signature and checksums are verified against the trusted roots (official key
        + imported plugin sources) before anything is written into place; a tampered
        package is rejected outright, an unsigned one classifies as third-party and
        must pass the risk confirmation wizard. Admin only.
      parameters:
      - description: package location
