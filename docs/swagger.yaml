        schema:
          $ref: '#/definitions/handles.RemoveReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: bad request or empty names
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: permission denied
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Remove files/directories
      tags:
      - fs
  /v4/fs/remove_empty_directory:
    post:
      consumes:
      - application/json
      description: Requires ActRemove on src_dir. Emptiness is checked against the
        unfiltered listing (not permission/hide-filtered), so a directory whose children
        are merely hidden from the caller is not treated as empty.
      parameters:
      - description: src_dir
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.RemoveEmptyDirectoryReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: permission denied
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Remove empty subdirectories
      tags:
      - fs
  /v4/fs/rename:
    post:
      consumes:
      - application/json
      description: Fails if path is password-protected (its meta has PasswordApplies).
        Requires ActRename on path.
      parameters:
      - description: path/name/overwrite
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.RenameReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: bad request or invalid name
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: permission denied, password-protected, or destination exists
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Rename file/directory
      tags:
      - fs
  /v4/fs/search:
    get:
      description: Recursively searches file/directory names (case-insensitive substring
        match) under parent. Requires ActRead on parent; every hit is re-authorized
        (ActRead, per-hit password) before being returned, so a subtree the caller
        cannot read is never leaked, on both the index-backed and BFS-fallback paths.
      parameters:
      - description: directory to search under (joined with the caller's base path)
        in: query
        name: parent
        required: true
        type: string
      - description: case-insensitive substring to match
        in: query
        name: keyword
        required: true
        type: string
      - description: password for password-protected paths, threaded into per-hit
          re-authorization
        in: query
        name: password
        type: string
      - description: page number (default 1; BFS fallback only)
        in: query
        name: page
        type: integer
      - description: items per page (default 50, max 200)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'data: {content: []searchItem, total: int, truncated: bool}'
          schema:
            $ref: '#/definitions/common.Resp-gin_H'
        "400":
          description: empty keyword
          schema:
            $ref: '#/definitions/common.Resp-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: no read permission on parent, or builtin.search disabled
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Search files
      tags:
      - search
  /v4/fs/thumb:
    get:
      description: 'Returns a resized JPEG preview of an image file (jpg/jpeg/png/gif/webp/bmp/tiff
        only -- video is out of scope). Generated on first request and cached under
        the data dir, keyed by path+size+modtime, so a stale cache is never served.
        op.Authorize(ActRead) on path is the sole access boundary: a caller only ever
        thumbnails what they could otherwise read.'
      parameters:
      - description: file path
        in: query
        name: path
        required: true
        type: string
      - description: max dimension in pixels, clamped to 32-512 (default 256)
        in: query
        name: w
        type: integer
      produces:
      - image/jpeg
      responses:
        "200":
          description: JPEG thumbnail
          schema:
            type: file
        "304":
          description: not modified (If-None-Match matched the current ETag)
        "400":
          description: missing path
        "403":
          description: no read permission on path
        "404":
          description: not found, a directory, or not a thumbnailable image
        "422":
          description: source too large or not a decodable image
        "500":
          description: internal error
      security:
      - ApiKeyAuth: []
      summary: Get file thumbnail
      tags:
      - fs
  /v4/labels:
    get:
      description: Returns the entire shared label vocabulary. Any logged-in user
        may read it.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-array_model_Label'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: List labels
      tags:
      - labels
  /v4/labels/{id}/files:
    get:
      description: Lists the caller-visible virtual paths bound to a label. Each bound
        node is authorized (ActRead) individually, so the view never reveals a path
        the caller may not see.
      parameters:
      - description: label id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-handles_LabelFilesResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: List files with a label
      tags:
      - labels
  /v4/labels/apply:
    post:
      consumes:
      - application/json
      description: Binds a label onto the object at path. Requires ActWrite on the
        path — no write permission, no relabel.
      parameters:
      - description: path + label id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.LabelBindingReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: no write permission on path
          schema:
            $ref: '#/definitions/common.Resp-any'
        "404":
          description: label not found
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Apply label
      tags:
      - labels
  /v4/labels/of:
    get:
      description: Returns the labels bound to the object at path. Requires ActRead
        on the path — you may only see the labels of files you may read.
      parameters:
      - description: file path
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-array_model_Label'
        "403":
          description: no read permission on path
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: List a path's labels
      tags:
      - labels
  /v4/labels/remove:
    post:
      consumes:
      - application/json
      description: Unbinds a label from the object at path. Requires ActWrite on the
        path, same gate as apply.
      parameters:
      - description: path + label id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.LabelBindingReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: no write permission on path
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Remove label
      tags:
      - labels
  /v4/me:
    get:
      consumes:
      - application/json
      description: Returns the user resolved from the request's access token; returns
        the guest user if no token is present.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-handles_UserResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Get current user
      tags:
      - auth
    put:
      consumes:
      - application/json
      description: Updates the authenticated user's profile (username, password, SSO
        ID). Not allowed for the guest user.
      parameters:
      - description: updated user fields (username/password/sso_id)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.User'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: guest user cannot update profile
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Update current user
      tags:
      - auth
  /v4/me/2fa/totp:
    delete:
      description: Removes the authenticated user's TOTP second factor after verifying
        either their current code (TOTP or recovery) or their account password. Clears
        every recovery code too. Not available to the guest user.
      parameters:
      - description: current code or password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.TOTPDeleteReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: totp not enabled / wrong proof
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: guest user
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Unbind TOTP
      tags:
      - auth
  /v4/me/2fa/totp/begin:
    post:
      description: Mints a fresh TOTP secret pending confirmation and returns it plus
        an otpauth:// URI for a QR code. Refuses if the account already has a confirmed
        TOTP secret (unbind first). Not available to the guest user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-handles_TOTPBeginResp'
        "400":
          description: totp already enabled
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: guest user
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Begin TOTP enrollment
      tags:
      - auth
  /v4/me/2fa/totp/confirm:
    post:
      consumes:
      - application/json
      description: Verifies the current code against the pending secret begun via
        /me/2fa/totp/begin; on success persists OtpSecret and mints 10 one-time recovery
        codes (returned exactly once). Not available to the guest user.
      parameters:
      - description: current authenticator code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.TOTPConfirmReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-handles_TOTPConfirmResp'
        "400":
          description: wrong code / no pending setup / already enabled
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: guest user
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Confirm TOTP enrollment
      tags:
      - auth
  /v4/me/2fa/totp/recovery-codes/regenerate:
    post:
      description: Mints a fresh batch of 10 one-time recovery codes for the authenticated
        user, invalidating every previously-issued code. Requires an existing TOTP
        enrollment. Not available to the guest user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-handles_TOTPRegenerateRecoveryCodesResp'
        "400":
          description: totp not enabled
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: guest user
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Regenerate TOTP recovery codes
      tags:
      - auth
  /v4/me/2fa/totp/status:
    get:
      description: Reports whether the authenticated user has TOTP bound and how many
        one-time recovery codes remain unused. Not available to the guest user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-handles_TOTPStatusResp'
        "403":
          description: guest user
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Get my TOTP status
      tags:
      - auth
  /v4/me/app-passwords:
    get:
      consumes:
      - application/json
      description: Returns all protocol app passwords belonging to the authenticated
        user. Never includes credential material.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-array_handles_AppPasswordDTO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: List my app passwords
      tags:
      - account
    post:
      consumes:
      - application/json
      description: Mints a new protocol app password for the authenticated user. The
        plaintext credential is returned once and never stored or retrievable again.
      parameters:
      - description: app password name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.CreateAppPasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-handles_CreateAppPasswordResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Create an app password
      tags:
      - account
  /v4/me/app-passwords/{id}:
    delete:
      consumes:
      - application/json
      description: Revokes one of the authenticated user's own app passwords. An unknown
        id or another user's id is a 404 and never deletes anything.
      parameters:
      - description: app password id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Delete an app password
      tags:
      - account
  /v4/me/sessions:
    get:
      consumes:
      - application/json
      description: Returns all device sessions (active and inactive) belonging to
        the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-array_handles_SessionResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: List my sessions
      tags:
      - auth
  /v4/me/sessions/{id}:
    delete:
      consumes:
      - application/json
      description: Marks the given session (must belong to the authenticated user)
        inactive, forcing that device to re-authenticate.
      parameters:
      - description: session id to evict
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.EvictSessionReq'
      - description: session id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Evict my session
      tags:
      - auth
  /v4/me/sso:
    get:
      responses: {}
  /v4/me/sso/{key}:
    delete:
      responses: {}
  /v4/public/settings:
    get:
      consumes:
      - application/json
      description: Returns the settings flagged PUBLIC (e.g. site title, logo), no
        authentication required.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-map_string_string'
      summary: Public settings
      tags:
      - public
  /v4/s/{token}:
    get:
      description: 'Returns the minimal public meta a landing page needs for a share
        token: base name, whether it is a directory, whether a password is required,
        and expiry. Anonymous, unauthenticated — no Authorization header is read.
        Missing/expired/disabled tokens all collapse to a uniform 404 (enumeration
        defense).'
      parameters:
      - description: share token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: name, is_dir, needs_password, expires_at
          schema:
            $ref: '#/definitions/common.Resp-any'
        "404":
          description: share not found, expired, or disabled
          schema:
            $ref: '#/definitions/common.Resp-any'
      summary: Get share info
      tags:
      - shares
  /v4/s/{token}/download:
    get:
      description: 302-redirects a file within the shared subtree to the existing
        unauthenticated /d sign channel. The path is confined by op.ShareSubPath before
        it is signed, so a signature is only ever minted for an in-subtree file. Anonymous,
        unauthenticated.
      parameters:
      - description: share token
        in: path
        name: token
        required: true
        type: string
      - description: sub-path within the share root, must resolve to a file
        in: query
        name: sub
        type: string
      - description: share password, required when the share is password-protected
        in: query
        name: password
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: redirect to the signed /d link
          schema:
            type: string
        "400":
          description: sub-path resolves to a directory
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: password required or incorrect
          schema:
            $ref: '#/definitions/common.Resp-any'
        "404":
          description: share not found, expired, disabled, or sub-path out of scope
          schema:
            $ref: '#/definitions/common.Resp-any'
      summary: Download a shared file (redirect)
      tags:
      - shares
  /v4/s/{token}/list:
    get:
      description: Lists the direct children of a path within the shared subtree.
        ?sub= is confined to the subtree by op.ShareSubPath; any escape attempt is
        folded into the same 404 as a missing share. Anonymous, unauthenticated.
      parameters:
      - description: share token
        in: path
        name: token
        required: true
        type: string
      - description: sub-path within the share root
        in: query
        name: sub
        type: string
      - description: share password, required when the share is password-protected
        in: query
        name: password
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: list of {name, is_dir, size}
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: password required or incorrect
          schema:
            $ref: '#/definitions/common.Resp-any'
        "404":
          description: share not found, expired, disabled, or sub-path out of scope
          schema:
            $ref: '#/definitions/common.Resp-any'
      summary: List a share's contents
      tags:
      - shares
  /v4/shares:
    get:
      description: 'Returns every share the caller created (creator isolation: only
        your own).'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-array_handles_ShareDTO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: List shares
      tags:
      - shares
    post:
      consumes:
      - application/json
      description: Mints a public share link for a path the caller can read. Requires
        ActRead on the target path — a share delegates the creator's read right, so
        no read permission means no share.
      parameters:
      - description: path + optional password/expiry
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handles.CreateShareReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-handles_ShareDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: no read permission on path
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Create share
      tags:
      - shares
  /v4/shares/{id}:
    delete:
      description: Revokes a share by id. A caller may only delete their own share
        unless they are an admin.
      parameters:
      - description: share id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: not the share's creator
          schema:
            $ref: '#/definitions/common.Resp-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
