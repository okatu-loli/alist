          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Get user
      tags:
      - admin-user
    put:
      consumes:
      - application/json
      description: Updates an existing user (matched by ID in the body). The admin
        user's role cannot be changed, and demoting the last enabled admin is rejected.
      parameters:
      - description: user to update, including id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.User'
      - description: user id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Resp-any'
        "400":
          description: invalid body, or attempted to assign admin/guest role
          schema:
            $ref: '#/definitions/common.Resp-any'
        "403":
          description: cannot change role of admin user, or would leave zero enabled
            admins
          schema:
            $ref: '#/definitions/common.Resp-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Resp-any'
      security:
      - ApiKeyAuth: []
      summary: Update user
      tags:
      - admin-user
