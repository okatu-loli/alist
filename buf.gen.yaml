version: v2
# clean is intentionally off: hand-written files (handshake.go, codec.go) live in
# the same output dir as the generated stubs, and buf clean would delete them.
plugins:
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10"]
    out: ext/grpcproto
    opt: paths=source_relative
  - local: ["go", "run", "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1"]
    out: ext/grpcproto
    opt: paths=source_relative
