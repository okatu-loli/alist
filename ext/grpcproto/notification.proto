syntax = "proto3";

package alist.ext.v1;

import "driver.proto";
import "host.proto";

option go_package = "github.com/AlistGo/alist-ext/grpcproto";

// NotificationService mirrors ext.Notification (W7b): a Kind=NotificationChannel
// plugin is a sink the host fans notices out to (email/webhook/Telegram/...) —
// a notification sink, not a veto (see ext.Notification's doc comment).
// Mirrors EventHookService (eventhook.proto) one Kind over, including the
// reverse-host InitHost bridge (F0/SP6).
service NotificationService {
  // GetManifest is the handshake: the manifest the host validates the plugin
  // against before dispatching notices to it.
  rpc GetManifest(Empty) returns (ManifestReply);

  // Notify delivers one host notice (ext.Notification.Notify). The host runs
  // this under panic + error isolation on its side (internal/extension);
  // Notify's own error, if any, crosses back as ErrorReply so the host can
  // log it — it is never treated as a veto.
  rpc Notify(NoticeProto) returns (ErrorReply);

  // Reverse host bridge (F0/SP6): host serves a HostService on the broker id it
  // passes here; the plugin dials it and delivers the host to Init.
  rpc InitHost(InitHostRequest) returns (ErrorReply);
}

// NoticeProto mirrors ext.Notice field-for-field (level/title/body/source/
// unix_milli) — the wire encoding of the notification payload Notify
// receives.
message NoticeProto {
  string level = 1;
  string title = 2;
  string body = 3;
  string source = 4;
  int64 unix_milli = 5;
}
