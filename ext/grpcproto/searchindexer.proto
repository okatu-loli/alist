syntax = "proto3";

package alist.ext.v1;

import "driver.proto";

option go_package = "github.com/AlistGo/alist-ext/grpcproto";

// SearchIndexerService mirrors ext.SearchIndexer (子项目 A / Phase E ring 1b):
// a Kind=SearchIndexer plugin is a real-index backend the `search` base builds
// once (as admin, over the full path space) and then queries cheaply, exactly
// like the built-in database/bleve/meilisearch backends. Mirrors
// OfflineDownloadToolService one Kind over, including the reverse-host InitHost
// bridge (F0/SP6): Config/Search/Index/BatchIndex/Get/Del/Clear are the 6
// business methods + Config from ext.SearchIndexer (ext/search_indexer.go:23-52),
// GetManifest is the handshake, InitHost is the reverse bridge.
service SearchIndexerService {
  // GetManifest is the handshake: the manifest the host validates the plugin
  // against before dispatching to it.
  rpc GetManifest(Empty) returns (ManifestReply);

  // Config reports the backend's identity (ext.SearchIndexer.Config): the Name
  // the search_index setting selects on, and whether it supports incremental
  // auto-update.
  rpc Config(Empty) returns (SearchIndexerConfigReply);

  // Search returns the nodes matching req plus the total hit count
  // (ext.SearchIndexer.Search). The base re-authorizes every hit per
  // requesting user — Search itself performs no access control.
  rpc Search(SearchReqProto) returns (SearchReply);

  // Index adds or updates a single node (ext.SearchIndexer.Index).
  rpc Index(IndexRequest) returns (ErrorReply);

  // BatchIndex adds or updates many nodes in one RPC (ext.SearchIndexer.
  // BatchIndex) — the build path fans out through this to amortize per-write
  // cost. The caller is responsible for keeping a single call's node count
  // within a sane wire-size budget (internal/search/build.go's buildBatchSize
  // already bounds it well under gRPC's default 4 MiB message cap).
  rpc BatchIndex(BatchIndexRequest) returns (ErrorReply);

  // Get returns the direct children previously indexed under parent
  // (ext.SearchIndexer.Get).
  rpc Get(IndexGetRequest) returns (IndexGetReply);

  // Del removes every node at or below prefix (ext.SearchIndexer.Del, a
  // subtree delete).
  rpc Del(IndexDelRequest) returns (ErrorReply);

  // Clear drops the entire index (ext.SearchIndexer.Clear).
  rpc Clear(Empty) returns (ErrorReply);

  // Reverse host bridge (F0/SP6): host serves a HostService on the broker id
  // it passes here; the plugin dials it and delivers the host to Init.
  rpc InitHost(InitHostRequest) returns (ErrorReply);
}

// SearchIndexerConfigReply mirrors ext.SearchIndexerConfig field-for-field.
message SearchIndexerConfigReply {
  string name = 1;
  bool auto_update = 2;
}

// SearchNodeProto mirrors ext.SearchNode field-for-field. There is
// deliberately no path field — the virtual path is derived as
// path.Join(parent, name), same as the Go side.
message SearchNodeProto {
  string parent = 1;
  string name = 2;
  bool is_dir = 3;
  int64 size = 4;
}

// SearchReqProto mirrors ext.SearchReq field-for-field.
message SearchReqProto {
  string parent = 1;
  string keywords = 2;
  int32 scope = 3; // 0 all, 1 dir, 2 file
  int32 page = 4;
  int32 per_page = 5;
}

message SearchReply {
  repeated SearchNodeProto nodes = 1;
  int64 total = 2;
  ErrorProto error = 3;
}

message IndexRequest {
  SearchNodeProto node = 1;
}

message BatchIndexRequest {
  repeated SearchNodeProto nodes = 1;
}

message IndexGetRequest {
  string parent = 1;
}

message IndexGetReply {
  repeated SearchNodeProto nodes = 1;
  ErrorProto error = 2;
}

message IndexDelRequest {
  string prefix = 1;
}
