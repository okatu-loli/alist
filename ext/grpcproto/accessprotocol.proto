syntax = "proto3";

package alist.ext.v1;

import "driver.proto";
import "host.proto";

option go_package = "github.com/AlistGo/alist-ext/grpcproto";

// AccessProtocolService mirrors ext.AccessProtocol's TransportHTTP half
// (design §2.1, §5, W9a): a Kind=AccessProtocol plugin exposing the AList
// filesystem over WebDAV/S3/MCP. Mirrors APIRouteService (apiroute.proto) one
// Kind over, including the reverse-host InitHost bridge (F0/SP6).
//
// ServeHTTP is the ONLY traffic RPC: HandleConn (TransportConn — FTP/SFTP) is
// NOT exposed here. A raw net.Conn is not serializable and per design §5 does
// not cross the gRPC boundary at all (see ext.AccessProtocol.HandleConn's doc
// comment) — a TransportConn protocol is native/in-process only, never a gRPC
// plugin. So a gRPC AccessProtocol is structurally HTTP-transport-only; its
// host-side client answers a HandleConn call with a "native only" error
// (ext.ErrCodeNotImplement) rather than attempting a wire call that has no
// message shape to carry it.
service AccessProtocolService {
  // GetManifest is the handshake: the manifest the host validates the plugin
  // against before mounting it.
  rpc GetManifest(Empty) returns (ManifestReply);

  // ProtocolInfo describes how the host binds this protocol
  // (ext.AccessProtocol.ProtocolInfo): scheme, transport, mount pattern.
  rpc ProtocolInfo(Empty) returns (ProtocolInfoReply);

  // ServeHTTP handles one inbound HTTP request (ext.AccessProtocol.ServeHTTP).
  // Reuses HTTPDoRequest/HTTPDoReply (host.proto) for the request/response
  // encoding, exactly as APIRouteService.Handle does.
  rpc ServeHTTP(HTTPDoRequest) returns (HTTPDoReply);

  // Reverse host bridge (F0/SP6): host serves a HostService on the broker id it
  // passes here; the plugin dials it and delivers the host to Init.
  rpc InitHost(InitHostRequest) returns (ErrorReply);
}

// ProtocolInfoReply mirrors ext.ProtocolInfo field-for-field.
message ProtocolInfoReply {
  string scheme = 1;
  // transport mirrors ext.Transport: 0 = TransportHTTP, 1 = TransportConn.
  int32 transport = 2;
  int32 default_port = 3;
  string mount_pattern = 4;
}
