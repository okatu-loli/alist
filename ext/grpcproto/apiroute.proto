syntax = "proto3";

package alist.ext.v1;

import "driver.proto";
import "host.proto";

option go_package = "github.com/AlistGo/alist-ext/grpcproto";

// APIRouteService mirrors ext.APIRoute (design §2.5 FeatureBundle = APIRoute +
// PublicPage + …): a Kind=APIRoute plugin declares the sub-routes it serves and
// handles proxied requests for them. Mirrors AuthProviderService (auth.proto)
// one Kind over, including the reverse-host InitHost bridge (F0/SP6). Handle's
// request/reply reuse host.proto's HTTPDoRequest/HTTPDoReply message shapes
// (method/url/header/body and status/header/body) rather than defining
// duplicate messages — the wire encoding of ext.HTTPRequest/ext.HTTPResponse is
// already frozen there.
service APIRouteService {
  // GetManifest is the handshake: the manifest the host validates/mounts routes
  // from.
  rpc GetManifest(Empty) returns (ManifestReply);

  // Routes declares the sub-routes this plugin serves (ext.APIRoute.Routes).
  rpc Routes(Empty) returns (RoutesReply);

  // Handle serves one proxied request (ext.APIRoute.Handle). Reuses
  // HTTPDoRequest/HTTPDoReply (host.proto) for the request/response encoding.
  rpc Handle(HTTPDoRequest) returns (HTTPDoReply);

  // Reverse host bridge (F0/SP6): host serves a HostService on the broker id it
  // passes here; the plugin dials it and delivers the host to Init.
  rpc InitHost(InitHostRequest) returns (ErrorReply);
}

// RouteDecl mirrors ext.RouteDecl.
message RouteDecl {
  string prefix = 1;
  bool public = 2;
}

message RoutesReply {
  repeated RouteDecl routes = 1;
}
