syntax = "proto3";

package alist.ext.v1;

import "driver.proto";
import "host.proto";

option go_package = "github.com/AlistGo/alist-ext/grpcproto";

// EventHookService mirrors ext.EventHook (W7): a Kind=EventHook plugin
// observes host events (fs mutations) after they commit — a notification
// sink, not a veto (see ext.EventHook's doc comment). Mirrors APIRouteService
// (apiroute.proto) one Kind over, including the reverse-host InitHost bridge
// (F0/SP6).
service EventHookService {
  // GetManifest is the handshake: the manifest the host validates the plugin
  // against before dispatching events to it.
  rpc GetManifest(Empty) returns (ManifestReply);

  // OnEvent delivers one host event (ext.EventHook.OnEvent). The host runs
  // this under panic + error isolation on its side (internal/extension);
  // OnEvent's own error, if any, crosses back as ErrorReply so the host can
  // log it — it is never treated as a veto of the already-committed
  // operation.
  rpc OnEvent(EventProto) returns (ErrorReply);

  // Reverse host bridge (F0/SP6): host serves a HostService on the broker id it
  // passes here; the plugin dials it and delivers the host to Init.
  rpc InitHost(InitHostRequest) returns (ErrorReply);
}

// EventProto mirrors ext.Event field-for-field (type/unix_milli/path/dst_path/
// actor) — the wire encoding of the notification payload OnEvent receives.
message EventProto {
  string type = 1;
  int64 unix_milli = 2;
  string path = 3;
  string dst_path = 4;
  string actor = 5;
}
