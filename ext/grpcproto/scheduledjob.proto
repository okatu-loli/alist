syntax = "proto3";

package alist.ext.v1;

import "driver.proto";
import "host.proto";

option go_package = "github.com/AlistGo/alist-ext/grpcproto";

// ScheduledJobService mirrors ext.ScheduledJob (W7): a Kind=ScheduledJob
// plugin declares its cadence and runs a time-driven task under the host's
// supervision (see ext.ScheduledJob's doc comment — panic-isolated,
// non-overlapping Run). Mirrors APIRouteService (apiroute.proto) one Kind
// over, including the reverse-host InitHost bridge (F0/SP6). Unlike
// APIRoute/Action, both Schedule and Run take no plugin-supplied arguments
// (Empty) — the host calls Schedule once at scheduler-start to read the
// cadence and Run once per tick, mirroring ext.ScheduledJob's argument-free
// methods exactly.
service ScheduledJobService {
  // GetManifest is the handshake: the manifest the host validates the plugin
  // against before scheduling it.
  rpc GetManifest(Empty) returns (ManifestReply);

  // Schedule returns the job's cadence spec (ext.ScheduledJob.Schedule),
  // parsed host-side by ParseSchedule.
  rpc Schedule(Empty) returns (ScheduleReply);

  // Run performs one execution (ext.ScheduledJob.Run). The host calls this
  // synchronously per tick, never overlapping two Runs of the same job.
  rpc Run(Empty) returns (ErrorReply);

  // Reverse host bridge (F0/SP6): host serves a HostService on the broker id it
  // passes here; the plugin dials it and delivers the host to Init.
  rpc InitHost(InitHostRequest) returns (ErrorReply);
}

message ScheduleReply {
  string spec = 1;
}
